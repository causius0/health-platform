<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c6e64" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Health Platform — prevenzione, monitoraggio e presa in carico per i lavoratori" />
    <title>Health Platform</title>
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Surface boot failures visibly instead of a silent white page.
      (function () {
        function show(msg) {
          var el = document.getElementById('boot-error');
          if (!el) {
            el = document.createElement('div');
            el.id = 'boot-error';
            el.style.cssText = 'position:fixed;inset:12px;z-index:9999;background:#b42318;color:#fff;' +
              'padding:12px 16px;border-radius:10px;font:12px/1.5 system-ui;white-space:pre-wrap;max-height:60vh;overflow:auto';
            document.body.appendChild(el);
          }
          el.textContent += (el.textContent ? '\n' : '') + msg;
        }
        window.addEventListener('error', function (e) { show((e.error && e.error.stack) || e.message); });
        window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && (e.reason.stack || e.reason))); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
