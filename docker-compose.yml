version: "3.9"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
      POSTGRES_DB: health_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://health:${POSTGRES_PASSWORD:-health}@db:5432/health_platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-mistral-3b}
      DB_AUTO_CREATE: "1"
      RATELIMIT_STORAGE_URI: sqlalchemy://health:${POSTGRES_PASSWORD:-health}@db:5432/health_platform
      AUTH_ISSUE_FALLBACK_TOKEN: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
