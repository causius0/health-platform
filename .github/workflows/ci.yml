name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health
          POSTGRES_DB: health_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The app module creates the Flask app (and, with DB_AUTO_CREATE=1, the
      # schema) at import time; point it at the test DB so collection works.
      DATABASE_URL: postgresql+psycopg://health:health@localhost:5432/health_platform_test
      TEST_DATABASE_URL: postgresql+psycopg://health:health@localhost:5432/health_platform_test
      JWT_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
